name: sonar-survey-coverage-planner

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-sonar-survey-coverage-planner}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-57532}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} && test \"$$(head -n 1 /var/lib/postgresql/data/postmaster.pid)\" = \"1\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 8s

  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-sonar-survey-coverage-planner}-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_DRIVER: postgres
      DB_HOST: db
      DB_INTERNAL_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable
      DB_AUTO_MIGRATE: "true"
      SEED_DATA: "true"
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-19532}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-sonar-survey-coverage-planner}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18532}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
